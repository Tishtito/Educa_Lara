; Educa queue workers — install to /etc/supervisor/conf.d/educa-worker.conf
;
; BEFORE INSTALLING, replace in this file:
;   /var/www/educa-api   -> the application directory on the server
;   /usr/bin/php         -> the output of `which php` on the server
; command= must use an ABSOLUTE php path: supervisord's minimal PATH does not
; resolve a bare `php`, and the program fails with `ERROR (spawn error)`.
;
; The two programs must match config('educa.queue.workers') exactly — the
; connection and --queue value are the key each worker's heartbeat is recorded
; under, and GET /up reports a worker whose heartbeat it cannot find as dead.
;
; After ANY deploy or .env change: `php artisan queue:restart`
; (see docs/deployment-vps.md). A running worker keeps the code and config it
; booted with.

[group:educa]
programs=educa-results,educa-general

; Recomputes exam results after marks are saved. Examiners wait on this, so it
; has dedicated processes and polls every second. Two processes let two schools'
; exams compute in parallel; runs for the same exam serialise on a row lock.
[program:educa-results]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/educa-api/artisan queue:work database --queue=results --sleep=1 --tries=3 --timeout=120 --max-time=3600 --max-jobs=500 --memory=256
directory=/var/www/educa-api
user=www-data
numprocs=2
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
; >= the job timeout, so stopping never kills a computation midway.
stopwaitsecs=150
redirect_stderr=true
stdout_logfile=/var/www/educa-api/storage/logs/worker-results.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; Everything else: report-card PDFs, notifications, unrouted jobs. Long-running,
; so it uses the database-long connection, whose retry_after (660 s) exceeds its
; 600 s timeout. It also drains `default` jobs dispatched on the database
; connection — both connections read the same jobs table, by queue name.
[program:educa-general]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/educa-api/artisan queue:work database-long --queue=timetables,reports,notifications,default --sleep=3 --tries=3 --timeout=600 --max-time=3600 --max-jobs=100 --memory=512
directory=/var/www/educa-api
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=660
redirect_stderr=true
stdout_logfile=/var/www/educa-api/storage/logs/worker-general.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
